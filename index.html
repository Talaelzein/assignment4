
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="config.js" defer></script>
    <script src="script.js" defer></script>
</head>

<body>

    <main class="dashboard">

        <!-- Dashboard header -->
        <header class="dashboard-header">

            <p class="header-label">
                YOUR DAILY LITTLE FORECAST ✦
            </p>

            <h1>☁ Weather Dashboard</h1>

            <p class="subtitle">
                Your little window to the sky ♡
            </p>

        </header>

        <!-- City search form -->
        <form id="weather-form">

            <label for="city-input">City Name</label>

            <input
                type="text"
                id="city-input"
                placeholder="Enter a city name"
                required
            >

            <button type="submit">Search Weather</button>

        </form>

        <!-- Loading indicator -->
        <p id="loading" role="status" hidden>
            Loading weather data...
        </p>

        <!-- Error message -->
        <p id="error-message" role="alert" hidden></p>

        <!-- Weather results -->
        <section id="weather-result" aria-label="Current weather" hidden>

            <!-- City and weather icon -->
            <div class="weather-header">

                <div>
                    <h2 id="city-name"></h2>
                    <p class="weather-label">Current weather</p>
                </div>

                <div
                    id="weather-icon"
                    role="img"
                    aria-label="Weather icon">
                </div>

            </div>

            <!-- Main weather information -->
            <div class="weather-main">

                <h3>
                    <span id="temperature"></span>°C
                </h3>

                <p id="description"></p>

            </div>

            <!-- Additional weather details -->
            <div class="weather-details">

                <!-- Humidity card -->
                <div class="detail-card">

                    <div class="detail-heading">

                        <svg
                            class="detail-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true">

                            <path d="M12 22a8 8 0 0 0 8-8c0-4-8-12-8-12S4 10 4 14a8 8 0 0 0 8 8z"/>

                        </svg>

                        <p>Humidity</p>

                    </div>

                    <h3>
                        <span id="humidity"></span>%
                    </h3>

                </div>

                <!-- Wind speed card -->
                <div class="detail-card">

                    <div class="detail-heading">

                        <svg
                            class="detail-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true">

                            <path d="M3 8h12a3 3 0 1 0-3-3"/>
                            <path d="M2 12h17a3 3 0 1 1-3 3"/>
                            <path d="M4 16h6a3 3 0 1 1-3 3"/>

                        </svg>

                        <p>Wind Speed</p>

                    </div>

                    <h3>
                        <span id="wind-speed"></span> m/s
                    </h3>

                </div>

            </div>

        </section>

        <!-- Footer -->
        <footer>
            <p>A little forecast, a little magic ✧</p>
        </footer>

    </main>

</body>
</html>
